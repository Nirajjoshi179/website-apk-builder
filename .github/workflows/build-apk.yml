name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL"
        required: true
        default: "https://example.com"
        type: string

      app_name:
        description: "App Name"
        required: true
        default: "My Website"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          echo "Using sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set Website URL
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/htmlhub/websiteapp/MainActivity.java"
          )

          text = file.read_text()
          url = os.environ["WEBSITE_URL"]

          text = re.sub(
              r'webView\.loadUrl\(".*?"\);',
              'webView.loadUrl("' +
              url.replace('\\', '\\\\').replace('"', '\\"') +
              '");',
              text
          )

          file.write_text(text)
          PY

      - name: Set App Name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          file = Path("app/src/main/AndroidManifest.xml")

          text = file.read_text()
          name = os.environ["APP_NAME"]

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="' +
              name.replace('\\', '\\\\').replace('"', '\\"') +
              '"',
              text
          )

          file.write_text(text)
          PY

      - name: Build Debug APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: app/build/outputs/apk/debug/app-debug.apk
