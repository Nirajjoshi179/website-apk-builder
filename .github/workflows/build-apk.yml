
name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Choose input mode"
        required: true
        type: choice
        options:
          - html
          - file
          - zip
          - url

      app_name:
        description: "App Name"
        required: true
        type: string
        default: "My Website"

      package_name:
        description: "Android Package ID"
        required: true
        type: string
        default: "com.htmlhub.websiteapp"

      website_url:
        description: "HTTPS URL (url mode)"
        required: false
        type: string
        default: "https://example.com"

      html_code:
        description: "HTML code (html mode)"
        required: false
        type: string

      source_path:
        description: "Supabase Storage path for file/zip"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SUPABASE_URL: https://wgylobjcxqmjsutgdhdz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_TYPE: ${{ inputs.source_type }}
      APP_NAME: ${{ inputs.app_name }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      WEBSITE_URL: ${{ inputs.website_url }}
      HTML_CODE: ${{ inputs.html_code }}
      SOURCE_PATH: ${{ inputs.source_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare source
        run: python3 scripts/prepare_source.py

      - name: Set app name
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.sax.saxutils as x

          p = Path("app/src/main/res/values")
          p.mkdir(parents=True, exist_ok=True)
          name = x.escape(os.environ["APP_NAME"][:40])
          (p / "strings.xml").write_text(
              f'<resources><string name="app_name">{name}</string></resources>'
          )
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK to Supabase
        run: |
          python3 - <<'PY'
          import os, re, urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          if not key:
              raise SystemExit("Missing SUPABASE_SERVICE_ROLE_KEY")

          name = re.sub(
              r"[^a-z0-9_-]+", "-",
              os.environ["APP_NAME"].lower()
          ).strip("-")[:40] or "website"

          filename = f"{name}-{os.environ['GITHUB_RUN_ID']}.apk"
          apk = open(
              "app/build/outputs/apk/debug/app-debug.apk", "rb"
          ).read()

          req = urllib.request.Request(
              f"{base}/storage/v1/object/apk-files/{filename}",
              data=apk,
              method="POST",
              headers={
                  "Authorization": f"Bearer {key}",
                  "apikey": key,
                  "Content-Type":
                      "application/vnd.android.package-archive",
                  "x-upsert": "true"
              }
          )

          with urllib.request.urlopen(req, timeout=120) as r:
              print("Upload status:", r.status)

          print(
              "APK URL:",
              f"{base}/storage/v1/object/public/apk-files/{filename}"
          )
          PY
