
name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Choose input mode"
        required: true
        type: choice
        options:
          - html
          - file
          - zip
          - url

      app_name:
        description: "App name"
        required: true
        type: string
        default: "My Website"

      package_name:
        description: "Android package name"
        required: true
        type: string
        default: "com.htmlhub.websiteapp"

      website_url:
        description: "Website URL for URL mode"
        required: false
        type: string
        default: "https://example.com"

      html_code:
        description: "HTML code for HTML mode"
        required: false
        type: string
        default: ""

      source_path:
        description: "Supabase Storage path for file or ZIP"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_NAME: ${{ inputs.app_name }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      SOURCE_TYPE: ${{ inputs.source_type }}
      WEBSITE_URL: ${{ inputs.website_url }}
      HTML_CODE: ${{ inputs.html_code }}
      SOURCE_PATH: ${{ inputs.source_path }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f scripts/prepare_source.py
          echo "Project files found."

      - name: Prepare website source
        run: python3 scripts/prepare_source.py

      - name: Set app name
        run: |
          if [ -f app/src/main/res/values/strings.xml ]; then
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "app/src/main/res/values/strings.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          name = os.environ.get("APP_NAME", "My Website")

          app_name = root.find("string[@name='app_name']")
          if app_name is None:
              app_name = ET.SubElement(root, "string", {"name": "app_name"})

          app_name.text = name
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          else
            echo "strings.xml not found."
            exit 1
          fi

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload APK to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          path = "app/build/outputs/apk/debug/app-debug.apk"

          with open(path, "rb") as f:
              apk = f.read()

          endpoint = (
              url
              + "/storage/v1/object/apk-files/website-apk/"
              + "website-app.apk"
          )

          request = urllib.request.Request(
              endpoint,
              data=apk,
              method="POST",
              headers={
                  "Authorization": "Bearer " + key,
                  "apikey": key,
                  "Content-Type": "application/vnd.android.package-archive",
                  "x-upsert": "true",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  print("Supabase upload status:", response.status)
                  print("APK uploaded to storage.")
          except urllib.error.HTTPError as error:
              print("Supabase upload failed:", error.code)
              print(error.read().decode("utf-8", errors="replace"))
              raise
          PY
