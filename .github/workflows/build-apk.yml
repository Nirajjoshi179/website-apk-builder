name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL"
        required: true
        default: "https://example.com"
        type: string

      app_name:
        description: "App Name"
        required: true
        default: "My Website"
        type: string


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Accept Android licenses
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -name sdkmanager -type f | head -1)

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true


      # 4. Install Android SDK
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -name sdkmanager -type f | head -1)

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"


      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # 6. Check Supabase Secret
      - name: Check Supabase Secret
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "❌ SUPABASE_SERVICE_ROLE_KEY missing"
            echo ""
            echo "Go to:"
            echo "Settings → Secrets and variables → Actions"
            echo ""
            echo "Create repository secret:"
            echo "SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          case "$KEY" in
            sb_secret_*)
              echo "✅ Supabase secret key found"
              ;;
            *)
              echo "❌ Wrong Supabase key format"
              echo "The key must start with sb_secret_"
              exit 1
              ;;
          esac


      # 7. Set Website URL
      - name: Set Website URL
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/htmlhub/websiteapp/MainActivity.java"
          )

          text = file.read_text()
          url = os.environ["WEBSITE_URL"]

          safe_url = (
              url.replace("\\", "\\\\")
                 .replace('"', '\\"')
          )

          text = re.sub(
              r'webView\.loadUrl\(".*?"\);',
              f'webView.loadUrl("{safe_url}");',
              text
          )

          file.write_text(text)
          PY


      # 8. Set App Name
      - name: Set App Name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          file = Path("app/src/main/AndroidManifest.xml")

          text = file.read_text()
          name = os.environ["APP_NAME"]

          safe_name = (
              name.replace("\\", "\\\\")
                  .replace('"', '\\"')
          )

          text = re.sub(
              r'android:label="[^"]*"',
              f'android:label="{safe_name}"',
              text
          )

          file.write_text(text)
          PY


      # 9. Build APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug


      # 10. Check APK
      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # 11. Upload APK to GitHub Artifact
      - name: Upload GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: app/build/outputs/apk/debug/app-debug.apk


      # 12. Upload APK to Supabase
      - name: Upload APK to Supabase
        env:
          SUPABASE_URL: "https://wgylobjcxqmjsutgdhdz.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_NAME: ${{ inputs.app_name }}
        run: |

          SAFE_NAME=$(echo "$APP_NAME" | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9_-]/-/g' | \
            sed 's/--*/-/g' | \
            sed 's/^-//' | \
            sed 's/-$//')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="website"
          fi

          APK_NAME="${SAFE_NAME}-${GITHUB_RUN_ID}.apk"

          echo "APK name: $APK_NAME"

          curl --fail-with-body \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/apk-files/${APK_NAME}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@app/build/outputs/apk/debug/app-debug.apk"

          echo "✅ APK uploaded successfully"


      # 13. Show APK Download URL
      - name: Show APK Download URL
        env:
          SUPABASE_URL: "https://wgylobjcxqmjsutgdhdz.supabase.co"
          APP_NAME: ${{ inputs.app_name }}
        run: |

          SAFE_NAME=$(echo "$APP_NAME" | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9_-]/-/g' | \
            sed 's/--*/-/g' | \
            sed 's/^-//' | \
            sed 's/-$//')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="website"
          fi

          APK_NAME="${SAFE_NAME}-${GITHUB_RUN_ID}.apk"

          APK_URL="${SUPABASE_URL}/storage/v1/object/public/apk-files/${APK_NAME}"

          echo ""
          echo "======================================"
          echo "✅ APK DOWNLOAD URL:"
          echo "$APK_URL"
          echo "======================================"
