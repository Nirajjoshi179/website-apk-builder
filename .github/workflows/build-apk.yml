name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Website source type"
        required: true
        type: choice
        options:
          - url
          - html
          - file
          - zip
      app_name:
        description: "App name"
        required: true
        type: string
        default: "My Website"
      package_name:
        description: "Android package name"
        required: true
        type: string
        default: "com.htmlhub.websiteapp"
      website_url:
        description: "Website URL (source_type = url)"
        required: false
        type: string
        default: "https://example.com"
      html_code:
        description: "HTML code (source_type = html)"
        required: false
        type: string
        default: ""
      source_path:
        description: "Supabase Storage file path (source_type = file/zip)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_NAME: ${{ inputs.app_name }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      SOURCE_TYPE: ${{ inputs.source_type }}
      WEBSITE_URL: ${{ inputs.website_url }}
      HTML_CODE: ${{ inputs.html_code }}
      SOURCE_PATH: ${{ inputs.source_path }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          case "$SOURCE_TYPE" in
            html)
              if [ -z "${HTML_CODE//[[:space:]]/}" ]; then
                echo "ERROR: source_type=html hai lekin html_code khali hai."
                echo "Fix: html_code bharo, ya source_type=url use karo."
                exit 1
              fi
              ;;
            url)
              if [ -z "$WEBSITE_URL" ]; then
                echo "ERROR: source_type=url hai lekin website_url khali hai."
                exit 1
              fi
              ;;
            file|zip)
              if [ -z "$SOURCE_PATH" ]; then
                echo "ERROR: source_type=$SOURCE_TYPE hai lekin source_path khali hai."
                exit 1
              fi
              ;;
          esac
          echo "Inputs OK (source_type=$SOURCE_TYPE)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest par Android SDK pehle se installed hai,
      # isliye "Setup Android SDK" action hata diya gaya hai.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check required files
        run: |
          test -f scripts/prepare_source.py
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts is missing."
            exit 1
          fi
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml is missing."
            exit 1
          fi

      - name: Prepare website source
        run: python3 scripts/prepare_source.py

      - name: Set application display name
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "app/src/main/res/values/strings.xml"
          if not os.path.isfile(path):
              raise SystemExit("strings.xml is missing")

          tree = ET.parse(path)
          root = tree.getroot()
          node = root.find("string[@name='app_name']")

          if node is None:
              node = ET.SubElement(root, "string", {"name": "app_name"})

          node.text = os.environ.get("APP_NAME", "My Website")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("App display name updated.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "APK was not created."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          apk_path = "app/build/outputs/apk/debug/app-debug.apk"

          with open(apk_path, "rb") as f:
              data = f.read()

          url = base + "/storage/v1/object/apk-files/website-apk/website-app.apk"

          request = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "apikey": key,
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/vnd.android.package-archive",
                  "x-upsert": "true"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  print("Supabase upload status:", response.status)
                  print("APK upload successful.")
          except urllib.error.HTTPError as e:
              print("Supabase upload failed:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
